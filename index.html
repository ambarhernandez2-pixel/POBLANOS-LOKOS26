<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>POBLANOS LOKOS</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: bebas neue, Bebas Neue;
    }

    body {
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    /* LOGO */
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid white;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    /* NOMBRE */
    h1 {
      font-size: 26px;
      margin-bottom: 7px;
      color: #111;
    }

    .description {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* BOTONES */
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      width: 100%;
      padding: 16px;
      margin-bottom: 14px;

      border-radius: 14px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;

      transition: 0.2s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .instagram {
      background: linear-gradient(45deg, #feda75, #d62976, #4f5bd5);
      color: white;
    }

    .facebook {
      background: #1877F2;
      color: white;
    }

    /* ICONOS */
    .icon {
      font-size: 22px;
    }

    /* SECCIÓN */
    .section {
      margin-top: 28px;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: bold;
      color: #444;
    }

    /* FOOTER */
    footer {
      margin-top: 30px;
      color: #999;
      font-size: 12px;
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO -->
    <!-- Cambia "logo.jpg" por el nombre de tu imagen -->
    <img src="logo.jpg.jpg" class="logo" alt="Logo">

    <!-- NOMBRE DE LA TIENDA -->
    <h1>POBLANOS LOKOS</h1>

    <p class="description">
      URBAN • STYLE • QUALITY
    </p>


    <!-- REDES SOCIALES -->

    <a
      href="https://wa.me/522215885143"
      class="button whatsapp"
      target="_blank">

      <span class="icon">💬</span>
      WhatsApp

    </a>


    <a
      href="https://instagram.com/poblanos_lokos"
      class="button instagram"
      target="_blank">

      <span class="icon">📸</span>
      Instagram

    </a>


    <a
      href="https://www.facebook.com/aleexgarcia15"
      class="button facebook"
      target="_blank">

      <span class="icon">📘</span>
      Facebook

    </a>


    <!-- INFORMACIÓN -->

    <div class="section">
    DISTRIBUIDOR YONERONE ENVÍOS EXPRESS A TODO MEXICO Y ESTADOS UNIDOS  ENTREGAS PERSONALES EN VARIOS PUNTOS DE LA CIUDAD DE PUEBLA
    </div>


    <footer>
      © 2026 POBLANOS LOKOS 
    </footer>

  </div>
<style>
.floating-img {
  position: fixed;
  width: 100px;
  height: 120px;
  object-fit: cover;
  padding: 6px;
  background: white;
  box-shadow: 0 8px 25px rgba(0,0,0,.35);
  z-index: 999;
  animation: flotar 5s ease-in-out infinite;
  pointer-events: none;
}

.f1 {
  left: 3%;
  top: 20%;
  transform: rotate(-8deg);
}

.f2 {
  right: 3%;
  top: 30%;
  transform: rotate(8deg);
  animation-delay: 1s;
}

.f3 {
  left: 5%;
  bottom: 12%;
  transform: rotate(6deg);
  animation-delay: 2s;
}

.f4 {
  right: 5%;
  bottom: 10%;
  transform: rotate(-7deg);
  animation-delay: 3s;
}

@keyframes flotar {
  0%, 100% {
    transform: translateY(0) rotate(-8deg);
  }
  50% {
    transform: translateY(-18px) rotate(-5deg);
  }
}

@media (max-width: 600px) {
  .floating-img {
    width: 65px;
    height: 80px;
  }
}
</style>
  <div class="floating-gallery">
  <img src="IMG_1828.jpeg" class="floating-img f1">
  <img src="IMG_1827.jpeg" class="floating-img f2">
  <img src="IMG_1826.jpeg" class="floating-img f3">
</div>
</body>
</html>
