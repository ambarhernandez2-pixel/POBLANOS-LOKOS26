<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>POBLANOS LOKOS</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: blacklisted, Bebas Neue;
    }

    body {
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    /* LOGO */
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid white;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    /* NOMBRE */
    h1 {
      font-size: 30px;
      margin-bottom: 7px;
      color: #111;
    }

    .description {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* BOTONES */
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      width: 100%;
      padding: 16px;
      margin-bottom: 14px;

      border-radius: 14px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;

      transition: 0.2s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .instagram {
      background: linear-gradient(45deg, #feda75, #d62976, #4f5bd5);
      color: white;
    }

    .facebook {
      background: #1877F2;
      color: white;
    }

    /* ICONOS */
    .icon {
      font-size: 22px;
    }

    /* SECCIÓN */
    .section {
      margin-top: 28px;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: bold;
      color: #444;
    }

    /* FOOTER */
    footer {
      margin-top: 30px;
      color: #999;
      font-size: 12px;
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO -->
    <!-- Cambia "logo.jpg" por el nombre de tu imagen -->
    <img src="logo.jpg.jpg" class="logo" alt="Logo">

    <!-- NOMBRE DE LA TIENDA -->
    <h1 class="titulo-poblanos">
  POBLANOS<br>
  <span>LOKOS</span>
</h1>


    <p class="description">
      URBAN • STYLE • QUALITY
    </p>


    <!-- REDES SOCIALES -->

    <a
      href="https://wa.me/522215885143"
      class="button whatsapp"
      target="_blank">

      <span class="icon">💬</span>
      WhatsApp

    </a>


    <a
      href="https://instagram.com/poblanos_lokos"
      class="button instagram"
      target="_blank">

      <span class="icon">📸</span>
      Instagram

    </a>


    <a
      href="https://www.facebook.com/aleexgarcia15"
      class="button facebook"
      target="_blank">

      <span class="icon">📘</span>
      Facebook

    </a>


    <!-- INFORMACIÓN -->

    <div class="section">
    DISTRIBUIDOR YONERONE ENVÍOS EXPRESS A TODO MEXICO Y ESTADOS UNIDOS  ENTREGAS PERSONALES EN VARIOS PUNTOS DE LA CIUDAD DE PUEBLA
    </div>


    <footer>
      © 2026 POBLANOS LOKOS 
    </footer>

  </div>
  <style>
/* ===== FOTOS POBLANOS LOKOS ===== */

.fotos-lokos {
  width: 100%;
  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
  gap: 10px;
  margin: 25px auto 30px;
  padding: 0 10px;
  box-sizing: border-box;
}

.fotos-lokos img {
  width: 85px !important;
  height: 105px !important;
  min-width: 85px !important;
  max-width: 85px !important;
  object-fit: cover !important;

  background: white;
  padding: 6px;
  box-sizing: border-box;

  border: 2px solid #111;
  box-shadow: 0 7px 18px rgba(0,0,0,.45);

  animation: fotosFlotan 4s ease-in-out infinite;
}

.fotos-lokos img:nth-child(1) {
  transform: rotate(-9deg);
}

.fotos-lokos img:nth-child(2) {
  transform: translateY(-8px) rotate(1deg);
  animation-delay: .6s;
}

.fotos-lokos img:nth-child(3) {
  transform: rotate(9deg);
  animation-delay: 1.2s;
}

@keyframes fotosFlotan {
  0%, 100% {
    margin-top: 0;
  }

  50% {
    margin-top: -6px;
  }
}

/* CELULAR */
@media (max-width: 600px) {
  .fotos-lokos img {
    width: 75px !important;
    height: 95px !important;
    min-width: 75px !important;
    max-width: 75px !important;
  }

  .fotos-lokos {
    gap: 6px;
  }
}
</style>
</div>
  <div class="floating-gallery">
  <img src="IMG_1828.jpeg" class="floating-img f1">
  <img src="IMG_1827.jpeg" class="floating-img f2">
  <img src="IMG_1826.jpeg" class="floating-img f3">
</div>
</body>
</html>
